<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 48px 56px;
      max-width: 520px;
      width: 100%;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 32px;
      color: #16213e;
    }

    ul {
      list-style: none;
    }

    li {
      padding: 16px 20px;
      margin-bottom: 12px;
      background: #f0f4ff;
      border-radius: 10px;
      font-size: 1.05rem;
      border-left: 4px solid #4361ee;
      transition: background 0.2s;
    }

    li:last-child {
      margin-bottom: 0;
    }

    li:hover {
      background: #e4ebff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Генератор идей для постов</h1>
    <ul>
      <li>5 идей постов для экспертов</li>
      <li>3 идеи сторис на сегодня</li>
      <li>Контент-план на неделю</li>
    </ul>
  </main>
</body>
</html>
